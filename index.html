<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos tecnológicos</title>
</head>
<body>

  <header>
    <h1>Eventos tecnológicos</h1>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="#ia">Inteligencia Artificial</a></li>
        <li><a href="#react">Desarrollo Web con React</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Próximos eventos</h2>

      <article id="ia">
        <h3>Introducción a Inteligencia Artificial</h3>
        <p>Evento para conocer conceptos básicos de IA.</p>
      </article>

      <article id="react">
        <h3>Desarrollo Web con React</h3>
        <p>Introducción al desarrollo de interfaces.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Universidad Católica de Pereira</p>
  </footer>

  <!-- Mi respuesta: La ventaja de usar article, header, section y footer en lugar de solo div es que cada etiqueta le da significado a la estructura. Los buscadores, los lectores de pantalla y otros programas entienden qué es el encabezado, cuál es el contenido principal y qué es el pie de página, lo que mejora la accesibilidad y el posicionamiento. Además, el código queda más ordenado y fácil de leer y mantener para cualquier programador, porque con un div no se sabe qué función cumple cada bloque. -->

</body>
</html>
